<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Missing Dog Mystery</title>
    <script src="script.js" defer></script>

</head>
<body>
    <h1 style="color: rgb(10, 89, 139); text-align:center; background-color: lightgray; border: dotted black 3px; padding-top: 1%; padding-bottom: 1%;">The Missing Dog Mystery</h1>
    <figure>
                <img src="dog.jpg" alt="dog image" width="200">
            </figure>
    <main>
        <section>
            <a href="about.html">About Me</a>
            <br>
            <a href="game.html">Play the Game</a>
            <h2 style="font-style:oblique;">Home</h2>
            <!-- description of location 1 -->
            <p style="letter-spacing: 5%;"> Welcome! Please fill out the info below and then click "Play the Game"!</p>
            
        <form action="game.html" method = "get">
            <!-- Asking for players name -->
             <input type="text" id="playerName" name="playerName" placeholder="Enter your name">
            <input type="submit" value="Submit">

            <!-- Asking if the player is ready (radio input) -->
            <h3 style="word-spacing: 10%;">Are you ready to start looking for the dog?</h3>
            <input type="radio" id="yes" name="ready" value="yes">
            <label for="yes">Yes</label><br>
            <input type="radio" id="no" name="ready" value="no">
            <label for="no">No</label><br>
            <input type="radio" id="not sure" name="ready" value="not sure">
            <label for="not sure">Not sure</label>

            <!-- player options (select tag)-->
            <h4 style="text-decoration: underline;">How much would you like to donate?</h4>
            <label for = "choices" style="font-weight: bold;">Choose an option:</label>
            <select name="choices" id="choices">
                <option value="empty"> </option>
                <option value="1">$1</option>
                <option value="5">$5</option>
                <option value="10">$10</option>
            </select>
            </form>
        </section>
        <br>
        
            <p><strong>Inventory</strong></p>
            <ul>
                <li>No items collected yet</li>
            </ul>
            <br>
        <section>
            <p><strong>Status</strong></p>
            <ul>
                <li>Dog found: False</li>
            </ul>
        </section>
    </main>
</body>
</html>
