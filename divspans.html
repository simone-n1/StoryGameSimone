<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Spans</title>
    <style> 
        .emphasis{
            color:orange;
            text-decoration:underline;
            font-family:monospace;
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>
    <h1 style="background-color: rgb(137, 183, 232);">This is a header</h1>

    <div style="background-color: cadetblue;
                text-align: center;">
        <h3>This is a header but <span style="color: red;">smaller</span></h3>
        <p>paragraph 1</p>
        <p class="emphasis">paragraph 2</p>
        <img 
            src="dog.jpg" 
            alt="dog image" 
            width="200">
    </div>

</body>
</html>
